<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            *{
                overflow: hidden;
            }

            #A{
                animation: pulaA 4s linear 0s infinite;
            }
            #B{
                animation: pulaB 8s linear 0s infinite;
                position: absolute;
                top: 90vh;
                left: 40vw;

            }
            #C{
                animation: rodar 2s linear 0s infinite;
                display: flex;
                justify-content: center; 
                align-items: center; 
            }
            @keyframes rodar {
                    0%{
                        transform: rotate(0deg);
                    }
                    100%{
                        transform: rotate(360deg);
                    }
            }
            @keyframes pulaA {
                    0%{
                        transform: translate(0, 0);
                    }
                    25% {
                        transform: translate(30%, 70vh);
                    }
                    60% {
                        transform: translate(80%, 20vh);
                    }
            }
            @keyframes pulaB {
                    0%{
                        transform: translate(0, 0);
                    }
                    15% {
                        transform: translate(80vw, 0);
                    }
                    20% {
                        transform: translate(-80vw, -40vh);
                    }
                    40% {
                        transform: translate(120vw, -80vh);
                    }
                    60% {
                        transform: translate(-70vw, -55vh);
                    }
                    100% {
                        transform: translate(0, 0);
                    }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="letra" id="A">A</div>
            <img id="B" src="duck.jfif">
            <img id="C" src="catlaugh.jfif">
        </div>
    </body>
</html>
